[versions]
# Android
androidGradlePlugin = "9.3.2"
compileSdk = "37"
minSdk = "30"
targetSdk = "36"

# Kotlin
kotlin = "2.4.10"
ksp = "2.3.11"
kotlinxCoroutines = "1.11.0"
kotlinxCollectionsImmutable = "0.5.1"
kotlinxSerialization = "1.11.0"

# AndroidX Core
androidxCore = "1.18.0"
androidxCoreSplashscreen = "1.2.0"
androidxActivity = "1.13.0"
androidxAppcompat = "1.8.0"
androidxMedia = "1.8.0"

# AndroidX Lifecycle
androidxLifecycle = "2.11.0"

# AndroidX Compose
androidxComposeBom = "2026.08.00"
androidxComposeMaterial3 = "1.5.0-alpha19"
androidxComposeMaterial3Adaptive = "1.3.0"
androidxComposeMaterial3AdaptiveNavigation = "1.4.0"
androidxComposeUiTextGoogleFonts = "1.12.0"
androidxGraphicsShapes = "1.0.1"

# AndroidX Navigation
androidxNavigation = "2.9.8"

# AndroidX Room
androidxRoom = "2.8.4"

# AndroidX DataStore
androidxDatastore = "1.2.1"
androidxDatastorePreferences = "1.2.1"

# AndroidX Work
androidxWork = "2.11.2"

# Material Color Utilities (HCT/TonalPalette/Score) — ponytail: com.google.android.material:0.3.0 not on mavenCentral nor dl.google (404); using KMP port com.materialkolor which is fetched from central and provides same HCT API
materialColorUtilities = "3.0.0-beta01"

# AndroidX Palette
androidxPalette = "1.0.0"

# Hilt
hilt = "2.60.1"
# hiltExt (hilt-work) is compiled against a specific WorkManager line: bump androidxWork together with it and
# check the androidx.hilt release notes for the minimum supported work version (silent failure: HiltWorkerFactory workers never start).
hiltExt = "1.4.0"
hiltNavigationCompose = "1.4.0"

# Media3
media3 = "1.11.0"
androidxMediarouter = "1.8.1"
playServicesCastFramework = "22.3.1"

# Network
okhttp = "5.5.0"
retrofit = "3.0.0"
jsoup = "1.23.1"
re2j = "1.8"

# Image Loading
coil3 = "3.5.0"

# Serialization
protobuf = "4.36.0"

# Security
tink = "1.23.0"

# Torrent
libtorrent4j = "2.1.0-39"

# Audio
ktaglib = "1.6.1"

# UI Libraries
haze = "1.7.2"
hypnoticcanvas = "0.4.1"
leanback = "1.2.0"

# Firebase
firebaseBom = "34.18.0"

# Benchmark
androidxBenchmark = "1.4.1"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestUiautomator = "2.4.0"

# Testing
junit = "4.13.2"
kotlinTest = "2.4.10"
mockito = "5.23.0"
mockitoKotlin = "6.3.0"
kotlinxCoroutinesTest = "1.11.0"
turbine = "1.2.1"
androidxTestCore = "1.7.0"
androidxTestExt = "1.3.0"
robolectric = "4.16.1"
truth = "1.4.5"
jimfs = "1.3.2"
kotest = "6.2.4"

# Diagnostics
leakcanary = "2.14"

# Code Quality
ktlint = "14.2.0"
detekt = "2.0.0-alpha.3"

[libraries]
# AndroidX Core

androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxCoreSplashscreen" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
